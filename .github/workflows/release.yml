name: Release artifacts

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v0.1.0

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0' }}

jobs:
  package:
    name: Package (${{ matrix.target }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$TARGET"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check version tag
        run: npm run release:version
      - name: Test tagged source
        run: cargo +stable test --locked --target "$TARGET"
      - name: Build native executables
        run: cargo +stable build --release --locked --target "$TARGET" --bin joom --example install_wrappers
      - name: Install wrapper entry points
        run: cargo +stable run --release --locked --target "$TARGET" --example install_wrappers -- --directory "target/$TARGET/release"
      - name: Package and smoke-test downloads
        run: npm run release:package
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
