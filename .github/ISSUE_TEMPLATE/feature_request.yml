name: Feature request
description: Suggest a command, parameter, or workflow improvement.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task and the limitation you encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show an example command or parameter file using fictional data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention existing commands or workarounds you tried.
